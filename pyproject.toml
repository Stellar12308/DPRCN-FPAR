[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dprcn-fpar"
version = "0.1.0"
description = "DPRCN-A3 for fine-resolution FPAR reconstruction"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "rasterio",
  "scikit-image",
  "matplotlib",
  "Pillow",
]

[tool.setuptools]
packages = ["dprcn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

